<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Signatures Normal Planet</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f4f4;color:#222;max-width:700px;margin:0 auto;padding:16px}
.carte{background:#fff;border-radius:8px;padding:16px;margin:16px 0}
.sig img{max-width:100%;height:auto}
button{padding:8px 14px;margin:8px 8px 0 0;cursor:pointer}
.ok{color:green;font-weight:bold}
.alerte{background:#ffe9c7;padding:10px;border-radius:6px}
</style></head><body>
<h1>Signatures mail · Normal Planet</h1>
<p>Clique sur <b>Copier la signature</b>, puis colle-la (Ctrl+V / Cmd+V) dans le champ signature de ta messagerie. Le mode d'emploi détaillé est dans <code>README.md</code>.</p>
<p id="alerte" class="alerte" hidden>⚠️ Les liens des images ne sont pas renseignés.</p>
<div id="liste"></div>
<script>
/* ====== À REMPLIR UNE FOIS : liens publics des 3 images (GitHub) ====== */
const IMAGES = [
  { nom: "1 · Forêt",   url: "https://raw.githubusercontent.com/guilhemkaus-code/normal-planet-signatures/main/images/signature-1-foret.jpg" },
  { nom: "2 · Musée",   url: "https://raw.githubusercontent.com/guilhemkaus-code/normal-planet-signatures/main/images/signature-2-musee.jpg" },
  { nom: "3 · Avatars", url: "https://raw.githubusercontent.com/guilhemkaus-code/normal-planet-signatures/main/images/signature-3-avatars.jpg" },
];
const LIEN = ""; // facultatif : page vers laquelle renvoie un clic sur la signature (site, bande-annonce…)
/* ========================================================================================== */
const fichiersLocaux = ["images/signature-1-foret.jpg","images/signature-2-musee.jpg","images/signature-3-avatars.jpg"];
const html = u => {
  const img = `<img src="${u}" width="300" height="100" alt="Normal Planet — César 2027, Sélection officielle, court métrage documentaire" style="display:block;width:100%;max-width:300px;height:auto;border:0">`;
  return `<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse"><tr><td>${LIEN ? `<a href="${LIEN}">${img}</a>` : img}</td></tr></table>`;
};
const pret = IMAGES.every(i => i.url.startsWith("http"));
document.getElementById("alerte").hidden = pret;
IMAGES.forEach((im, k) => {
  const d = document.createElement("div"); d.className = "carte";
  const code = html(im.url);
  d.innerHTML = `<h2>${im.nom}</h2><div class="sig" id="s${k}">${pret ? code : html(fichiersLocaux[k])}</div>
    <button data-k="${k}" class="c">Copier la signature</button><button data-k="${k}" class="h">Copier le code HTML</button><span id="m${k}"></span>`;
  document.getElementById("liste").appendChild(d);
});
async function copier(k, brut){
  const code = html(IMAGES[k].url), m = document.getElementById("m"+k);
  try{
    if(brut) await navigator.clipboard.writeText(code);
    else await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([code],{type:"text/html"}),"text/plain":new Blob([code],{type:"text/plain"})})]);
  }catch(e){ // repli : sélection manuelle
    const r=document.createRange(); r.selectNode(document.getElementById("s"+k));
    getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand("copy");
  }
  m.textContent=" Copié ✓"; m.className="ok"; setTimeout(()=>m.textContent="",2000);
}
document.addEventListener("click", e => { if(e.target.dataset.k!==undefined) copier(+e.target.dataset.k, e.target.classList.contains("h")); });
</script>
</body></html>
